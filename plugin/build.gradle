plugins {
  id "java-gradle-plugin"
  id "com.vanniktech.maven.publish" version "0.36.0"
}

apply plugin: 'kotlin'

repositories {
  mavenCentral()
}

dependencies {
  implementation gradleApi()
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

  testImplementation 'junit:junit:4.13.2'
}

compileKotlin {
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_11
  }
}
compileTestKotlin {
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_11
  }
}
java {
  sourceCompatibility JavaVersion.VERSION_11
  targetCompatibility JavaVersion.VERSION_11
}

gradlePlugin {
  plugins {
    modulesGraphAssert {
      id = 'com.eygraber.module.graph.assertion'
      displayName = 'Modules Graph Assert'
      description = 'Gradle plugin to keep your modules graph healthy and lean.'
      implementationClass = 'com.jraska.module.graph.assertion.ModuleGraphAssertionsPlugin'
    }
    modulesGraphAssertSettings {
      id = 'com.eygraber.module.graph.assertion.settings'
      displayName = 'Modules Graph Assert Settings Plugin'
      description = 'Settings plugin for isolated projects compatibility.'
      implementationClass = 'com.jraska.module.graph.assertion.ModuleGraphAssertionsSettingsPlugin'
    }
  }
}
